server {
    listen 80;
    server_name ship-happens.duckdns.org;
    
    # Redirect all HTTP requests to HTTPS (specifying the custom external port 14361)
    return 301 https://$host:14361$request_uri;
}

server {
    listen 443 ssl;
    server_name ship-happens.duckdns.org;

    ssl_certificate /etc/nginx/certs/live/ship-happens.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/ship-happens.duckdns.org/privkey.pem;

    # Strong SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Docker's internal DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend (Flask webapp)
    location / {
        set $frontend frontend:5000;
        proxy_pass         http://$frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
    }

    # Backend (FastAPI scanner)
    location /api/ {
        set $backend backend:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
    }
}