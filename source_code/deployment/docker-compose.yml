# docker-compose.yml — mirrors setup.sh deployment exactly
#
# Usage:
#   docker compose up --build -d       # start everything
#   docker compose logs -f             # stream all logs
#   docker compose down                # stop and remove containers

services:

  # ── scanner.service equivalent ────────────────────────────────────────────
  backend:
    build:
      context: .. # build context = source_code/
      dockerfile: deployment/Dockerfile.backend
    env_file:
      - .env # Use the symlinked env file
    expose:
      - "8000" # internal only — Nginx proxies this
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── website.service equivalent ────────────────────────────────────────────
  frontend:
    build:
      context: .. # build context = source_code/
      dockerfile: deployment/Dockerfile.frontend
    environment:
      # Point Flask at the backend container name (not 127.0.0.1)
      SCANNER_API: http://backend:8000/zombie-scan
    expose:
      - "5000" # internal only — Nginx proxies this
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ── certbot for automated SSL via DuckDNS ─────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl
        SUBDOMAIN=$$(echo $$DOMAIN | cut -d. -f1)
        certbot certonly --manual \
          --manual-auth-hook "curl -s \"https://www.duckdns.org/update?domains=$$SUBDOMAIN&token=$$DUCKDNS_TOKEN&txt=$$CERTBOT_VALIDATION\" && sleep 30" \
          --manual-cleanup-hook "curl -s \"https://www.duckdns.org/update?domains=$$SUBDOMAIN&token=$$DUCKDNS_TOKEN&txt=&clear=true\"" \
          --preferred-challenges dns \
          --email $$EMAIL \
          --agree-tos \
          --no-eff-email \
          -d $$DOMAIN \
          --non-interactive
    volumes:
      - ./certs:/etc/letsencrypt
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    networks:
      - app-network

  # ── nginx equivalent ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      # Expose Nginx ports.
      # VM maps external 14361 -> internal 443
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      certbot:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
